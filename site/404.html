<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found</title>
<!-- Keep this file at the top level of the site (restyle it as you like): with it, GitHub Pages, Netlify and Cloudflare
     Pages answer a missing file with status 404. Without it, Cloudflare Pages answers every unknown path with
     /index.html and status 200, so a file that is gone (an older version's) would not read as missing. -->
<style>
  body { font: 16px/1.6 system-ui, sans-serif; margin: 0; padding: 24px 16px; background: #f4f1ea; color: #222; }
  main { max-width: 720px; }
  a { color: #1a5fb4; }
</style>
</head>
<body>
<main>
  <h1>Not found</h1>
  <p>There is nothing at this address.</p>
</main>
</body>
</html>
